<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A white Swiss cross on red">
  <rect width="1600" height="900" fill="#E03A2B"/>
  <!-- The federal proportions: on a square of 32 units the cross is centred,
       each arm 6 units wide and 7 long, leaving a 6-unit margin all round.
       The square here is the full height, so 1 unit is 28px. -->
  <path fill="#ffffff" d="M716 170h168v196h196v168H884v196H716V534H520V366h196z"/>
</svg>
