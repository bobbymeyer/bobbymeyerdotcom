# Project pages embed each repository's README, fetched from GitHub when the
# site builds. Netlify only builds on pushes here, so a README edited in
# halftoner or pandatone would sit unpublished until something else landed.
#
# One scheduled build covers every project, and every project added later:
# the build re-fetches them all, so nothing has to be configured per
# repository. Run it by hand from the Actions tab to publish sooner.
name: refresh readmes

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK is not set; nothing to trigger." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
