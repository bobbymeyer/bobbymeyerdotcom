[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Two projects deploy themselves to GitHub Pages and are served from here on
# this domain, at a path of their own. Netlify proxies rather than redirects,
# so the address bar keeps saying bobbymeyer.com and the game is a page of
# this site rather than a link off it.
#
# One rule each, and no companion rule sending the bare path to the trailing
# slash: Netlify strips a trailing slash before it matches, so `from = "/gridi"`
# matches `/gridi/` as well and a rule pointing at `/gridi/` answers itself. The
# preview served a 301 loop and neither game loaded. The splat matches the bare
# path too, with an empty splat, so one rule covers both spellings.
#
# 200! carries the bang: it tells Netlify to apply the rule even when a file
# exists at that path, which is what keeps a project from being shadowed the
# day someone adds a page with the same name.

[[redirects]]
  from = "/succession/*"
  to = "https://bobbymeyer.github.io/succession/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gridi/*"
  to = "https://bobbymeyer.github.io/gridi/:splat"
  status = 200
  force = true
